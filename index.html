<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Game Selection UI</title>
    <meta name="description" content="Game Selection UI • A-Frame">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@gh-pages/examples/js/info-message.js"></script>
    <script src="highlight.js"></script>
    <script src="info-panel.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@gh-pages/examples/js/remix-dropdown.js"></script>
  </head>
  <body>
    <a-scene
      background="color: #212"
      environment
      cursor="rayOrigin: mouse; fuse: false" 
      raycaster="objects: .raycastable"
      info-message="htmlSrc: #messageText">
      
      <a-assets>
        <a-asset-item id="messageText" src="message.html"></a-asset-item>

        <!-- Nine Sols -->
        <img id="nineSols" src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1000&q=80" crossorigin="anonymous"/>
        <img id="nineSolsPoster" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80" crossorigin="anonymous"/>

        <!-- Hollow Knight -->
        <img id="hollowKnight" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1000&q=80" crossorigin="anonymous"/>
        <img id="hollowKnightPoster" src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=600&q=80" crossorigin="anonymous"/>

        <!-- Blasphemous -->
        <img id="blasphemous" src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1000&q=80" crossorigin="anonymous"/>
        <img id="blasphemousPoster" src="https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=600&q=80" crossorigin="anonymous"/>

        <!-- Mixins -->
        <a-mixin
          id="frame"
          geometry="primitive: plane; width: 0.5783552; height: 0.8192"
          material="color: white; shader: standard; roughness: 0.1; metalness: 0.5"
          animation__scale="property: scale; to: 1.4 1.4 1.4; dur: 100; startEvents: mouseenter"
          animation__scale_reverse="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
        ></a-mixin>

        <a-mixin
          id="poster"
          geometry="primitive: plane; width: 0.544768; height: 0.786432"
          material="color: white; shader: standard; roughness: 0.1; metalness: 0.5"
          position="0 0 0.005"
        ></a-mixin>

        <a-mixin
          id="gameImage"
          geometry="primitive: plane; width: 1.5; height: 0.81"
          material="src: #hollowKnight; shader: standard; roughness: 0.2; metalness: 0.1; transparent: true"
          position="0 0.495 0.002"
        ></a-mixin>
      </a-assets>

      <!-- Background setup -->
      <a-entity
        id="background"
        position="0 0 0"
        geometry="primitive: sphere; radius: 2.0"
        material="color: red; side: back; shader: standard"
        scale="0.001 0.001 0.001"
        visible="false" 
        class="raycastable">
      </a-entity>

      <a-entity
        position="0 1.6 0"
        camera 
        look-controls="magicWindowTrackingEnabled: false; touchEnabled: false; mouseEnabled: false">
        <a-entity
          id="fadeBackground"
          geometry="primitive: sphere; radius: 2.5"
          material="color: #999999; side: back; shader: standard; blending: subtractive;" 
          visible="false">
        </a-entity>
      </a-entity>

      <!-- Hand controls -->
      <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .raycastable"></a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .raycastable" line="color: #118A7E"></a-entity>

      <a-entity id="ui" position="0 1.6 -2.5">
        <!-- Poster menu -->
        <a-entity id="menu" highlight>
          <a-entity id="blasphemousButton" position="-0.8 0 0" mixin="frame" class="raycastable menu-button">
            <a-entity material="src: #blasphemousPoster" mixin="poster"></a-entity>
          </a-entity>

          <a-entity id="nineSolsButton" position="0 0 0" mixin="frame" class="raycastable menu-button">
            <a-entity material="src: #nineSolsPoster" mixin="poster"></a-entity>
          </a-entity>

          <a-entity id="hollowKnightButton" position="0.8 0 0" mixin="frame" class="raycastable menu-button">
            <a-entity material="src: #hollowKnightPoster" mixin="poster"></a-entity>
          </a-entity>
        </a-entity>

        <!-- Info panel of the selected game -->
        <a-entity
          id="infoPanel"
          position="0 0 0.5"
          info-panel
          visible="false"
          scale="0.001 0.001 0.001"
          geometry="primitive: plane; width: 1.5; height: 1.8"
          material="color: #333333; shader: standard; roughness: 0.5; transparent: false" 
          class="raycastable">
          
          <a-entity id="hollowKnightGameImage" mixin="gameImage" material="src: #hollowKnight" visible="false"></a-entity>
          <a-entity id="nineSolsGameImage" mixin="gameImage" material="src: #nineSols" visible="false"></a-entity>
          <a-entity id="blasphemousGameImage" mixin="gameImage" material="src: #blasphemous" visible="false"></a-entity>
          
          <a-entity 
            id="movieTitle"
            position="-0.68 -0.1 0"
            text="shader: msdf; anchor: left; width: 1.5; font: https://cdn.aframe.io/examples/ui/Viga-Regular.json; color: white; value: Hollow Knight">
          </a-entity>
          
          <a-entity 
            id="movieDescription"
            position="-0.68 -0.2 0"
            text="baseline: top; shader: msdf; anchor: left; font: https://cdn.aframe.io/examples/ui/Viga-Regular.json; color: white; value: Forge your own path in Hollow Knight! An epic action adventure through a vast ruined kingdom of insects and heroes. Explore twisting caverns, battle tainted creatures and befriend bizarre bugs, all in a classic, hand-drawn 2D style.">
          </a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
