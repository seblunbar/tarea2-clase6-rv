<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Laser input UI</title>
    <meta name="description" content="Laser input UI • A-Frame">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@gh-pages/examples/js/info-message.js"></script>
    
    <script>
      // Game database containing info for each entry
      const GAME_DATA = {
        blasphemousButton: {
          title: "Blasphemous (2019)",
          description: "A punishment-heavy action-platformer that combines the fast-paced, skilled combat of a hack-n-slash game with a deep and evocative narrative core delivered through exploration of a huge universe.",
          imageElId: "blasphemousGameImage"
        },
        nineSolsButton: {
          title: "Nine Sols (2024)",
          description: "A lore-rich, hand-drawn 2D action-platformer featuring Sekiro-inspired deflection-focused combat. Embark on a journey of Eastern fantasy, explore the land once ruled by an ancient alien race.",
          imageElId: "nineSolsGameImage"
        },
        hollowKnightButton: {
          title: "Hollow Knight (2017)",
          description: "Forge your own path in Hollow Knight! An epic action adventure through a vast ruined kingdom of insects and heroes. Explore twisting caverns, battle tainted creatures and befriend bizarre bugs.",
          imageElId: "hollowKnightGameImage"
        }
      };

      // Custom A-Frame component to handle click events on posters
      AFRAME.registerComponent('info-panel', {
        init: function () {
          const el = this.el;
          const gameTitle = document.querySelector('#gameTitle');
          const gameDescription = document.querySelector('#gameDescription');
          const gameImages = document.querySelectorAll('[mixin="gameImage"]');
          const background = document.querySelector('#background');

          // Attach click listener to all buttons in the menu
          const buttons = document.querySelectorAll('.menu-button');
          buttons.forEach(button => {
            button.addEventListener('click', (evt) => {
              const data = GAME_DATA[button.id];
              if (!data) return;

              // 1. Hide all main images
              gameImages.forEach(img => img.setAttribute('visible', 'false'));

              // 2. Set active image visible
              const activeImage = document.querySelector(`#${data.imageElId}`);
              if (activeImage) activeImage.setAttribute('visible', 'true');

              // 3. Update Text
              gameTitle.setAttribute('text', 'value', data.title);
              gameDescription.setAttribute('text', 'value', data.description);

              // 4. Show the Info Panel & Background dismiss sphere
              el.setAttribute('visible', 'true');
              el.setAttribute('scale', '1 1 1');
              background.setAttribute('visible', 'true');
              background.setAttribute('scale', '1 1 1');
            });
          });

          // Close menu when clicking outside/background sphere
          background.addEventListener('click', () => {
            el.setAttribute('visible', 'false');
            el.setAttribute('scale', '0.001 0.001 0.001');
            background.setAttribute('visible', 'false');
            background.setAttribute('scale', '0.001 0.001 0.001');
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene
      background="color: #212"
      environment
      cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .raycastable">
      <a-assets>
        <!--Nine Sols-->
        <img id="nineSols" src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1809540/ss_82027cbc20c7c1ba76898fa07e2c9657870b8b13.1920x1080.jpg?t=1782464830" crossorigin="anonymous"/>
        <img id="nineSolsPoster" src="https://store-images.s-microsoft.com/image/apps.45976.14000456863863255.e1180b2d-029d-4c02-9385-6ad73421ad63.508279c9-acdd-45b3-9321-9d8f45feb958" crossorigin="anonymous"/>

        <!--Hollow Knight-->
        <img id="hollowKnight" src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/367520/ss_5384f9f8b96a0b9934b2bc35a4058376211636d2.1920x1080.jpg?t=1776125684" crossorigin="anonymous"/>
        <img id="hollowKnightPoster" src="https://cdn2.steamgriddb.com/grid/d18c832e8c956b4ef8b92862e6bf470d.png" crossorigin="anonymous"/>

        <!--Blasphemous-->
        <img id="blasphemous" src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/774361/ss_67e9de6ea4dc169d21aaacb3d8625e2e0b3e025d.1920x1080.jpg?t=1780479368" crossorigin="anonymous"/>
        <img id="blasphemousPoster" src="https://cdn2.steamgriddb.com/grid/d220b363fa173729b6b2851776d4e6db.png" crossorigin="anonymous"/>
        
        <a-mixin
          id="frame"
          geometry="primitive: plane; width: 0.5783552; height: 0.8192"
          material="color: white; shader: standard"
          animation__scale="property: scale; to: 1.4 1.4 1.4; dur: 100; startEvents: mouseenter"
          animation__scale_reverse="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
        ></a-mixin>
        
        <a-mixin
          id="poster"
          geometry="primitive: plane; width: 0.544768; height: 0.786432"
          material="color: white; shader: standard"
          position="0 0 0.005"
        ></a-mixin>
        
        <!-- Enlarged Game Image Mixin -->
        <a-mixin
          id="gameImage"
          geometry="primitive: plane; width: 2.0; height: 1.08"
          material="shader: flat; transparent: true"
          position="0 0.45 0.002"
        ></a-mixin>
      </a-assets>

      <!-- Dismiss background plane -->
      <a-entity
        id="background"
        position="0 0 -1"
        geometry="primitive: sphere; radius: 5.0"
        material="color: black; side: back; shader: flat; opacity: 0.5; transparent: true"
        scale="0.001 0.001 0.001"
        visible="false" 
        class="raycastable">
      </a-entity>

      <a-entity
        position="0 1.6 0"
        camera look-controls="magicWindowTrackingEnabled: false; touchEnabled: false; mouseEnabled: false">
      </a-entity>

      <!-- Hand controls -->
      <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .raycastable"></a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .raycastable" line="color: #118A7E"></a-entity>

      <a-entity id="ui" position="0 1.6 -2.5">
        <!-- Poster menu -->
        <a-entity id="menu">
          <a-entity id="blasphemousButton" position="-0.8 0 0" mixin="frame" class="raycastable menu-button">
            <a-entity material="src: #blasphemousPoster" mixin="poster"></a-entity>
          </a-entity>

          <a-entity id="nineSolsButton" position="0 0 0" mixin="frame" class="raycastable menu-button">
            <a-entity material="src: #nineSolsPoster" mixin="poster"></a-entity>
          </a-entity>

          <a-entity id="hollowKnightButton" position="0.8 0 0" mixin="frame" class="raycastable menu-button">
            <a-entity material="src: #hollowKnightPoster" mixin="poster"></a-entity>
          </a-entity>
        </a-entity>

        <!-- Info panel enlarged -->
        <a-entity
          id="infoPanel"
          position="0 0 0.5"
          info-panel
          visible="false"
          scale="0.001 0.001 0.001"
          geometry="primitive: plane; width: 2.2; height: 2.2"
          material="color: #333333; shader: flat; transparent: false" 
          class="raycastable">
          <a-entity id="hollowKnightGameImage" mixin="gameImage" material="src: #hollowKnight" visible="false"></a-entity>
          <a-entity id="nineSolsGameImage" mixin="gameImage" material="src: #nineSols" visible="false"></a-entity>
          <a-entity id="blasphemousGameImage" mixin="gameImage" material="src: #blasphemous" visible="false"></a-entity>
          
          <!-- Cleaned Text Entities (Fixes blocky artifact) -->
          <a-entity id="gameTitle"
            position="-0.95 -0.2 0.001"
            text="value: Title; width: 2.2; color: white; anchor: left">
          </a-entity>

          <a-entity id="gameDescription"
            position="-0.95 -0.35 0.001"
            text="value: Description; width: 1.9; color: white; anchor: left; baseline: top; wrapCount: 40">
          </a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
